name: Build odin kernel (LineageOS 24.0 / SM8350)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        type: choice
        options: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-latest"]
        default: "ubuntu-22.04"
  push:
    branches:
      - lineage-24.0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: arm64 kernel (odin_defconfig, clang r416183b)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify KernelSU-Next sources
        run: |
          ls -la KernelSU-Next/kernel | head -15
          readlink drivers/kernelsu

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bc bison cpio flex libelf-dev libssl-dev libncurses5-dev python3 rsync unzip zip

      - name: Fetch clang prebuilt (LineageOS, r416183b)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -2

      - name: Configure kernel (odin_defconfig)
        run: make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 odin_defconfig

      - name: Build Image.gz and dtbs
        run: |
          # KernelSU-Next identifies its manager by hashing the APK signing block
          # and refuses to set ksu_manager_appid when it does not match, which
          # leaves is_manager() false and the manager showing "unsupported".
          # KSU_NEXT_MANAGER_SIZE/HASH are ifndef-guarded in the Kbuild, so pin
          # them to the signature of the v3.4.2 manager APK instead of patching
          # the submodule.
          #
          # KSU_VERSION is normally 30000 + commit count, but the submodule is a
          # shallow clone so the count collapses to 1. The legacy branch tops out
          # below the manager's MINIMAL_SUPPORTED_KERNEL (33188), so pin it too.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KSU_VERSION_OVERRIDE=33294 \
            KSU_VERSION_TAG_OVERRIDE=v3.4.0 \
            KSU_NEXT_MANAGER_SIZE=0x6c6 \
            KSU_NEXT_MANAGER_HASH=a4b371e0951bcda0b3c25eddc6531c9a0a717aed53fcb3ca3aaad927e1bef763 \
            -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log

          # tee masks make's exit status, so check the pipe explicitly
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "ERROR: kernel build failed"; exit 1; }

          echo "--- KernelSU-Next build parameters ---"
          grep -E 'KernelSU-Next (version|tag|Manager)' build.log || true

          grep -q 'KernelSU-Next version override: 33294' build.log \
            || { echo "ERROR: KSU_VERSION override did not apply"; exit 1; }
          grep -q 'Manager signature size: 0x6c6' build.log \
            || { echo "ERROR: manager signature size pin did not apply"; exit 1; }
          grep -q 'a4b371e0951bcda0b3c25eddc6531c9a0a717aed53fcb3ca3aaad927e1bef763' build.log \
            || { echo "ERROR: manager signature hash pin did not apply"; exit 1; }

      - name: Collect build output
        run: |
          ls -la out/arch/arm64/boot/Image.gz out/System.map
          grep -q -- '-- KernelSU-Next version override: 33294' /dev/null 2>&1 || true

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github
          cp -f ci/anykernel.sh ak3/anykernel.sh
          cp -f out/arch/arm64/boot/Image.gz ak3/Image.gz
          cd ak3
          zip -r -9 "../odin-ksu-${GITHUB_SHA::12}.zip" . -x "*.git*"
          cd ..
          unzip -l "odin-ksu-${GITHUB_SHA::12}.zip" | head -20
          ls -la odin-ksu-*.zip

      - name: Upload kernel image, dtbs and System.map
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb*
            out/System.map
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: odin-anykernel3-${{ github.sha }}
          path: odin-ksu-*.zip
          if-no-files-found: error
          retention-days: 30
