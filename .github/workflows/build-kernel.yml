name: Build odin kernel (LineageOS 24.0 / SM8350)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        type: choice
        options: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-latest"]
        default: "ubuntu-22.04"
  push:
    branches:
      - lineage-24.0
      - rekernel-x
    paths-ignore:
      - 'tools/**'
      - '.github/workflows/build-probe.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: arm64 kernel (odin_defconfig, clang r416183b)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify SukiSU sources
        run: |
          ls -la KernelSU/kernel | head -15
          readlink drivers/kernelsu
          test -f fs/susfs.c && grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h && echo "SUSFS 2.3.0 present"

      - name: Patch SukiSU for pre-5.10
        run: |
          set -e
          # SukiSU's builtin branch assumes a 5.10+ kernel. The five adaptations
          # this tree needs are kept as a real patch file so the same tree can
          # be built locally without replaying the CI-only sed/perl pipeline.
          git -C KernelSU apply --verbose ../patches/sukisu-ultra-5.4/0001-suki-pre510-compat.patch

          echo '--- verification ---'
          ! grep -q '<linux/static_call.h>' KernelSU/kernel/kernel_includes.h
          grep -q 'DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled)' KernelSU/kernel/feature/sucompat.c
          grep -q 'config KSU_SUSFS_PRIORITY_UID_FILTER' KernelSU/kernel/Kconfig
          grep -q 'ksu_cs_vdso_clock_mode' KernelSU/kernel/extension/cpu_spoof.c
          test "$(grep -c 'susfs_set_batch_sid' KernelSU/kernel/selinux/rules.c)" -eq 2
          echo "all five pre-5.10 adaptations present"

      - name: Unshallow SukiSU submodule
        run: |
          set -e
          if [ "$(git -C KernelSU rev-parse --is-shallow-repository)" = "true" ]; then
            git -C KernelSU fetch --unshallow --tags origin builtin
          fi
          echo "commit count: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bc bison cpio flex libelf-dev libssl-dev libncurses5-dev python3 rsync unzip zip

      - name: Fetch clang prebuilt (LineageOS, r416183b)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -2

      - name: Configure kernel (odin_defconfig)
        run: make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 odin_defconfig

      - name: Build Image.gz and dtbs
        run: |
          # SukiSU version comes from the submodule commit count; SUSFS 2.3.0 is
          # already applied and enabled via CONFIG_KSU_SUSFS, KPM via CONFIG_KPM.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log

          # tee masks make's exit status
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "ERROR: kernel build failed"; exit 1; }

          echo "--- KernelSU / SUSFS ---"
          grep -iE 'kernelsu|susfs|kpm|nomount' build.log | head -20 || true

          grep -q 'CONFIG_KSU_SUSFS=y' out/.config \
            || { echo "ERROR: SUSFS not enabled"; exit 1; }
          grep -q 'CONFIG_KPM=y' out/.config \
            || { echo "ERROR: KPM not enabled"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config \
            || { echo "ERROR: SUSFS priority uid filter not enabled"; exit 1; }
          echo "SUSFS and KPM confirmed in out/.config"

      - name: Verify ipset is built in
        run: |
          set -e
          for sym in CONFIG_IP_SET CONFIG_IP_SET_BITMAP_IP CONFIG_IP_SET_BITMAP_IPMAC \
                     CONFIG_IP_SET_BITMAP_PORT CONFIG_IP_SET_HASH_IP \
                     CONFIG_IP_SET_HASH_IPMAC CONFIG_IP_SET_HASH_IPMARK \
                     CONFIG_IP_SET_HASH_IPPORT CONFIG_IP_SET_HASH_IPPORTIP \
                     CONFIG_IP_SET_HASH_IPPORTNET CONFIG_IP_SET_HASH_MAC \
                     CONFIG_IP_SET_HASH_NET CONFIG_IP_SET_HASH_NETPORT \
                     CONFIG_IP_SET_HASH_NETIFACE CONFIG_IP_SET_HASH_NETNET \
                     CONFIG_IP_SET_HASH_NETPORTNET CONFIG_IP_SET_LIST_SET \
                     CONFIG_NETFILTER_XT_SET; do
            grep -qx "$sym=y" out/.config \
              || { echo "ERROR: $sym missing from out/.config"; exit 1; }
          done

          # AnyKernel3 ships no .ko files, so these must be built in.
          if grep -qE '^CONFIG_IP_SET(=|_[A-Z_]*)=m$' out/.config; then
            echo "ERROR: ipset built as a module, the flashed image would lack it"
            exit 1
          fi

          # A built-in ipset leaves its device_initcall entry and a core
          # export in vmlinux. System.map spells initcalls as
          # __initcall_<n>_<line>_<fn>6, so match the suffix only.
          grep -qE '_ip_set_init6$' out/System.map \
            || { echo "ERROR: ip_set device_initcall absent from System.map"; exit 1; }
          grep -qE '_xt_set_init6$' out/System.map \
            || { echo "ERROR: xt_set device_initcall absent from System.map"; exit 1; }
          grep -q ' ip_set_test$' out/System.map \
            || { echo "ERROR: ip_set_test absent from System.map"; exit 1; }

          echo "ipset core, all set types and xt_set confirmed in Image.gz"

      - name: Verify NoMount is built in
        run: |
          set -e
          grep -qx 'CONFIG_NOMOUNT=y' out/.config \
            || { echo "ERROR: CONFIG_NOMOUNT not enabled"; exit 1; }

          # AnyKernel3 ships no .ko files, so NoMount must be built in.
          if grep -qE '^CONFIG_NOMOUNT=m$' out/.config; then
            echo "ERROR: NoMount built as a module, the flashed image would lack it"
            exit 1
          fi

          # A built-in fs_initcall leaves a __initcall_<n>_<line>_<fn>5 entry.
          grep -qE '_nomount_init5$' out/System.map \
            || { echo "ERROR: nomount fs_initcall absent from System.map"; exit 1; }

          # Address-taken callbacks survive -O3 inlining; these two prove the
          # key-type handler and the VFS lookup hook were actually emitted.
          grep -qE ' nm_key_preparse$' out/System.map \
            || { echo "ERROR: nm_key_preparse absent from System.map"; exit 1; }
          grep -qE ' nm_hijacked_lookup$' out/System.map \
            || { echo "ERROR: nm_hijacked_lookup absent from System.map"; exit 1; }

          echo "NoMount v22 confirmed built into Image.gz"

      - name: Verify ReKernel-X is built in
        run: |
          set -e
          grep -qx 'CONFIG_REKERNEL_X=y' out/.config \
            || { echo "ERROR: CONFIG_REKERNEL_X not enabled"; exit 1; }

          # AnyKernel3 ships no .ko files, so ReKernel-X must be built in.
          if grep -qE '^CONFIG_REKERNEL_X=m$' out/.config; then
            echo "ERROR: ReKernel-X built as a module, the flashed image would lack it"
            exit 1
          fi

          # A built-in late_initcall leaves a __initcall_<n>_<line>_<fn>7 entry.
          grep -qE '_rkx_init7$' out/System.map \
            || { echo "ERROR: rkx late_initcall absent from System.map"; exit 1; }

          # The four exported vendor hooks are the only bridge into binder and
          # signal; without them the driver loads but observes nothing.
          for sym in android_vh_binder_trans android_vh_binder_reply \
                     android_vh_binder_alloc_new_buf_locked android_vh_do_send_sig_info; do
            grep -q " __tracepoint_$sym$" out/System.map \
              || { echo "ERROR: __tracepoint_$sym missing from System.map"; exit 1; }
          done

          # These are address-taken in the workqueue and netfilter callbacks.
          grep -qE ' rkx_send_message$' out/System.map \
            || { echo "ERROR: rkx_send_message absent from System.map"; exit 1; }
          grep -qE ' rkx_nf_local_in$' out/System.map \
            || { echo "ERROR: rkx_nf_local_in absent from System.map"; exit 1; }

          echo "ReKernel-X core, initcall and 4 vendor hooks confirmed in Image.gz"

      - name: Collect build output
        run: |
          ls -la out/arch/arm64/boot/Image.gz out/System.map

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github
          cp -f ci/anykernel.sh ak3/anykernel.sh
          cp -f out/arch/arm64/boot/Image.gz ak3/Image.gz
          cd ak3
          zip -r -9 "../odin-ksu-${GITHUB_SHA::12}.zip" . -x "*.git*"
          cd ..
          unzip -l "odin-ksu-${GITHUB_SHA::12}.zip" | head -20
          ls -la odin-ksu-*.zip

      - name: Upload kernel image, dtbs and System.map
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb*
            out/System.map
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: odin-anykernel3-${{ github.sha }}
          path: odin-ksu-*.zip
          if-no-files-found: error
          retention-days: 30
