name: Build odin kernel (LineageOS 24.0 / SM8350)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        type: choice
        options: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-latest"]
        default: "ubuntu-22.04"
  push:
    branches:
      - lineage-24.0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: arm64 kernel (odin_defconfig, AOSP clang r574158)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify SukiSU sources
        run: |
          ls -la KernelSU/kernel | head -15
          readlink drivers/kernelsu
          test -f fs/susfs.c && grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h && echo "SUSFS 2.3.0 present"

      - name: Patch SukiSU for pre-5.10
        run: |
          set -e
          # SukiSU unconditionally includes a 5.10+ header it never uses.
          INC=KernelSU/kernel/kernel_includes.h
          grep -n 'static_call' "$INC" || true
          sed -i '\|^#include <linux/static_call.h>$|d' "$INC"
          echo "removed unconditional static_call.h include"
          grep -c 'static_call' "$INC" || echo "no static_call references left"

          # SUSFS 2.3.0 drives su-compat through static_branch_likely(),
          # but SukiSU still declares ksu_su_compat_enabled as a plain bool.
          SU=KernelSU/kernel/feature/sucompat.c
          SUH=KernelSU/kernel/feature/sucompat.h
          sed -i 's/^bool ksu_su_compat_enabled __read_mostly = true;$/DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);/' "$SU"
          sed -i 's/^extern bool ksu_su_compat_enabled;$/extern struct static_key_true ksu_su_compat_enabled;/' "$SUH"
          sed -i 's/\*value = ksu_su_compat_enabled ? 1 : 0;/*value = static_key_enabled(\&ksu_su_compat_enabled) ? 1 : 0;/' "$SU"
          perl -0pi -e 's/^    ksu_su_compat_enabled = enable;$/    if (enable)\n        static_branch_enable(\&ksu_su_compat_enabled);\n    else\n        static_branch_disable(\&ksu_su_compat_enabled);/m' "$SU"
          sed -i 's/if (!ksu_su_compat_enabled)/if (!static_key_enabled(\&ksu_su_compat_enabled))/' "$SU"
          echo '--- su_compat static key conversion ---'
          grep -n 'ksu_su_compat_enabled' "$SU" "$SUH"

          # SukiSU ships no Kconfig entry for the SUSFS 2.3.0 priority uid
          # filter, yet its own pkg_observer/dispatch call it unconditionally,
          # so SUSFS hides the prototypes and the kernel side will not compile.
          KCFG=KernelSU/kernel/Kconfig
          if ! grep -q 'KSU_SUSFS_PRIORITY_UID_FILTER' "$KCFG"; then
            printf '\nconfig KSU_SUSFS_PRIORITY_UID_FILTER\n\tbool "Enable to allow adding user-defined uids that will be hidden from getpriority/setpriority/ioprio_get/ioprio_set syscall"\n\tdepends on KSU_SUSFS\n\tdefault y\n\thelp\n\t  - Allow hiding user-defined uids from syscalls like getpriority/setpriority/ioprio_get/ioprio_set.\n\t  - Effective on all processes with uid >= 10000.\n' >> "$KCFG"
          fi
          grep -A2 'config KSU_SUSFS_PRIORITY_UID_FILTER' "$KCFG"

          # struct clocksource gained vdso_clock_mode in 5.10; on 5.4 the same
          # field lives in archdata.clock_mode (arm64 always selects
          # ARCH_CLOCKSOURCE_DATA). cpu_spoof.c writes it through this alias so
          # the 6.18/5.10-only branch keeps compiling.
          CS=KernelSU/kernel/extension/cpu_spoof.c
          printf '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#define ksu_curr_cs_vdso_clock_mode(p) ((*(p))->vdso_clock_mode)\n#else\n#define ksu_curr_cs_vdso_clock_mode(p) ((*(p))->archdata.clock_mode)\n#endif\n' > /tmp/ksu_cs_mode.h
          sed -i '\|^#include <linux/version.h>$|r /tmp/ksu_cs_mode.h' "$CS"
          sed -i 's|(\*curr_cs_ptr)->vdso_clock_mode|ksu_curr_cs_vdso_clock_mode(curr_cs_ptr)|' "$CS"
          echo '--- cpu_spoof clocksource shim ---'
          grep -n 'ksu_curr_cs_vdso_clock_mode' "$CS"

      - name: Unshallow SukiSU submodule
        run: |
          set -e
          if [ "$(git -C KernelSU rev-parse --is-shallow-repository)" = "true" ]; then
            git -C KernelSU fetch --unshallow --tags origin builtin
          fi
          echo "commit count: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bc bison cpio flex libelf-dev libssl-dev libncurses5-dev python3 rsync unzip zip

      - name: Fetch clang prebuilt (AOSP r574158)
        run: |
          set -e
          # The vendor DLKM set is built against AOSP clang r574158 (clang 21,
          # Android build 14475230). genksyms derives CONFIG_MODVERSIONS CRCs
          # from the preprocessed token stream, so a different clang produces
          # different CRCs and every vendor module refuses to load.
          SHA=0de484af3d9532df3a4a6023c408ecc436df23a3
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${SHA}/clang-r574158.tar.gz"
          mkdir -p "$HOME/clang"
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz "$URL"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -3

      - name: Configure kernel (odin_defconfig)
        run: make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 odin_defconfig

      - name: Build Image.gz and dtbs
        run: |
          # SukiSU version comes from the submodule commit count; SUSFS 2.3.0 is
          # already applied and enabled via CONFIG_KSU_SUSFS, KPM via CONFIG_KPM.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log

          # tee masks make's exit status
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "ERROR: kernel build failed"; exit 1; }

          echo "--- KernelSU / SUSFS ---"
          grep -iE 'kernelsu|susfs|kpm' build.log | head -20 || true

          grep -q 'CONFIG_KSU_SUSFS=y' out/.config \
            || { echo "ERROR: SUSFS not enabled"; exit 1; }
          grep -q 'CONFIG_KPM=y' out/.config \
            || { echo "ERROR: KPM not enabled"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y' out/.config \
            || { echo "ERROR: SUSFS priority uid filter not enabled"; exit 1; }
          echo "SUSFS and KPM confirmed in out/.config"

      - name: Collect build output
        run: |
          ls -la out/arch/arm64/boot/Image.gz out/System.map

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github
          cp -f ci/anykernel.sh ak3/anykernel.sh
          cp -f out/arch/arm64/boot/Image.gz ak3/Image.gz
          cd ak3
          zip -r -9 "../odin-ksu-${GITHUB_SHA::12}.zip" . -x "*.git*"
          cd ..
          unzip -l "odin-ksu-${GITHUB_SHA::12}.zip" | head -20
          ls -la odin-ksu-*.zip

      - name: Upload kernel image, dtbs and System.map
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb*
            out/System.map
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: odin-anykernel3-${{ github.sha }}
          path: odin-ksu-*.zip
          if-no-files-found: error
          retention-days: 30
