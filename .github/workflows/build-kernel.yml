name: Build odin kernel (LineageOS 24.0 / SM8350)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image"
        type: choice
        options: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-latest"]
        default: "ubuntu-22.04"
  push:
    branches:
      - lineage-24.0

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: arm64 kernel (odin_defconfig, clang r416183b)
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Verify KernelSU-Next sources
        run: |
          ls -la KernelSU-Next/kernel | head -15
          readlink drivers/kernelsu

      - name: Unshallow KernelSU-Next submodule
        run: |
          set -e
          # Kbuild derives KSU_VERSION from the git commit count, but the submodule
          # is cloned with --depth=1, which collapses the count to 1.
          if [ "$(git -C KernelSU-Next rev-parse --is-shallow-repository)" = "true" ]; then
            git -C KernelSU-Next fetch --unshallow --tags origin legacy
          fi
          echo "commit count: $(git -C KernelSU-Next rev-list --count HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bc bison cpio flex libelf-dev libssl-dev libncurses5-dev python3 rsync unzip zip

      - name: Fetch clang prebuilt (LineageOS, r416183b)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -2

      - name: Configure kernel (odin_defconfig)
        run: make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 odin_defconfig

      - name: Build Image.gz and dtbs
        run: |
          # Official legacy derives KSU_VERSION as 30000 + commit count + 289, and
          # the Kbuild unshallows the submodule before counting, so no override is
          # needed. The manager signature defaults (0x3e6 / 79e59011...) already
          # match the shipped v3.4.x APK certificate and must stay unchanged.
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log

          # tee masks make's exit status
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "ERROR: kernel build failed"; exit 1; }

          echo "--- KernelSU-Next build parameters ---"
          grep -E 'KernelSU-Next (version|tag|Manager)' build.log || true

          grep -q 'KernelSU-Next version: ' build.log \
            || { echo "ERROR: KSU version was not derived"; exit 1; }
          KSUVER=$(grep -oE 'KernelSU-Next version: [0-9]+' build.log | head -1 | awk '{print $NF}')
          echo "derived KSU_VERSION: $KSUVER"
          [ "$KSUVER" -gt 33000 ] \
            || { echo "ERROR: KSU_VERSION $KSUVER too low, submodule still shallow"; exit 1; }
          grep -q 'Manager signature size: 0x3e6' build.log \
            || { echo "ERROR: unexpected manager signature size"; exit 1; }
          grep -q '79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7' build.log \
            || { echo "ERROR: unexpected manager signature hash"; exit 1; }

      - name: Collect build output
        run: |
          ls -la out/arch/arm64/boot/Image.gz out/System.map

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github
          cp -f ci/anykernel.sh ak3/anykernel.sh
          cp -f out/arch/arm64/boot/Image.gz ak3/Image.gz
          cd ak3
          zip -r -9 "../odin-ksu-${GITHUB_SHA::12}.zip" . -x "*.git*"
          cd ..
          unzip -l "odin-ksu-${GITHUB_SHA::12}.zip" | head -20
          ls -la odin-ksu-*.zip

      - name: Upload kernel image, dtbs and System.map
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb*
            out/System.map
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: odin-anykernel3-${{ github.sha }}
          path: odin-ksu-*.zip
          if-no-files-found: error
          retention-days: 30
